<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kuyum Satış Sistemi v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; }
    .logo { font-size: 60px; margin-bottom: 20px; }
    h1 { color: white; margin-bottom: 40px; font-size: 36px; }
    .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .menu-item { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); text-decoration: none; color: #333; transition: transform 0.3s; }
    .menu-item:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .menu-item .icon { font-size: 40px; margin-bottom: 10px; }
    .menu-item .title { font-size: 18px; font-weight: bold; }
    .menu-item .desc { font-size: 12px; color: #666; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🏪</div>
    <h1>KUYUM SATIŞ SİSTEMİ v2</h1>
    
    <div class="menu">
      <a href="dashboard.html" class="menu-item">
        <div class="icon">📊</div>
        <div class="title">Dashboard</div>
        <div class="desc">Tüm satışlar & Raporlar</div>
      </a>
      
      <a href="satis-girisi.html" class="menu-item">
        <div class="icon">➕</div>
        <div class="title">Satış Giriş</div>
        <div class="desc">Yeni satış kaydı</div>
      </a>
      
      <a href="rehber-portal.html" class="menu-item">
        <div class="icon">👤</div>
        <div class="title">Rehber Portal</div>
        <div class="desc">Kişisel komis. raporu</div>
      </a>
      
      <a href="acente-portal.html" class="menu-item">
        <div class="icon">🏢</div>
        <div class="title">Acente Portal</div>
        <div class="desc">Kişisel komis. raporu</div>
      </a>
    </div>
  </div>
</body>
</html>
